name: Secret Scan

# Deterministic secret detection on PRs using gitleaks. Complements the LLM-based
# security review in pr-validation.yml with a fast, rule-based, free (no Kiro
# credits) scanner — strengthening DOD-11 (no secrets in diff or history) with a
# check that does not depend on an agent's judgement.
#
# Scope: secrets only. PII *content* scanning is a separate decision (it needs a
# dedicated tool such as Microsoft Presidio or a cloud DLP service, and depends on
# whether the pilot handles regulated data) — see the responsible-AI gap list in
# docs/leadership/responsible-ai-framework-mapping.md.
#
# Disabled by default per cost-control posture: gh workflow enable secret-scan.yml
# Make it a required status check in branch protection once piloted.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      full_history:
        description: 'Scan full git history instead of just the PR commits'
        required: false
        default: 'false'
        type: string

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: '8.18.4'

jobs:
  gitleaks:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks version

      - name: Scan for secrets
        id: scan
        run: |
          set -uo pipefail
          REPORT="gitleaks-report.json"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            echo "Scanning PR commit range ${BASE}..${HEAD}"
            ./gitleaks detect --source . --redact -v \
              --report-format json --report-path "$REPORT" \
              --log-opts="${BASE}..${HEAD}"
          elif [ "${{ inputs.full_history }}" = "true" ]; then
            echo "Scanning full git history"
            ./gitleaks detect --source . --redact -v \
              --report-format json --report-path "$REPORT"
          else
            echo "Scanning working tree (no-git)"
            ./gitleaks detect --source . --no-git --redact -v \
              --report-format json --report-path "$REPORT"
          fi
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          if [ -f gitleaks-report.json ] && [ "$(cat gitleaks-report.json)" != "[]" ] && [ -s gitleaks-report.json ]; then
            COUNT=$(grep -o '"RuleID"' gitleaks-report.json | wc -l || echo "?")
            echo "::error::Secret scan found potential secrets ($COUNT finding(s)). Values are redacted in the report. Remove the secret, rotate it, and rewrite history if it was committed."
            {
              echo "## Secret Scan — findings"
              echo ""
              echo "gitleaks found **$COUNT** potential secret(s). The actual values are redacted."
              echo ""
              echo "Next steps: remove the secret from the diff, **rotate it** (assume it is compromised once committed), and use a managed secret store per \`.kiro/steering/security-baseline.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "## Secret Scan — clean ✅" >> "$GITHUB_STEP_SUMMARY"
            echo "No secrets detected by gitleaks v${GITLEAKS_VERSION}." >> "$GITHUB_STEP_SUMMARY"
          fi
