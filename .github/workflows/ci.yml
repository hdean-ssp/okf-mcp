name: Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    name: Detect project type
    runs-on: ubuntu-latest
    outputs:
      has_node: ${{ steps.detect.outputs.has_node }}
      has_dotnet: ${{ steps.detect.outputs.has_dotnet }}
      has_python: ${{ steps.detect.outputs.has_python }}
      has_go: ${{ steps.detect.outputs.has_go }}
      has_helm: ${{ steps.detect.outputs.has_helm }}
      has_terraform: ${{ steps.detect.outputs.has_terraform }}
      has_docker: ${{ steps.detect.outputs.has_docker }}

    steps:
      - uses: actions/checkout@v4

      - name: Detect project stacks
        id: detect
        run: |
          has_node=false; has_dotnet=false; has_python=false; has_go=false
          has_helm=false; has_terraform=false; has_docker=false

          [ -f package.json ] && has_node=true
          find . -maxdepth 3 -name '*.csproj' -o -name '*.sln' 2>/dev/null | head -1 | grep -q . && has_dotnet=true
          [ -f pyproject.toml ] || [ -f requirements.txt ] || [ -f setup.py ] && has_python=true
          [ -f go.mod ] && has_go=true
          find . -maxdepth 3 -name 'Chart.yaml' 2>/dev/null | head -1 | grep -q . && has_helm=true
          find . -maxdepth 3 -name '*.tf' 2>/dev/null | head -1 | grep -q . && has_terraform=true
          find . -maxdepth 3 -name 'Dockerfile' 2>/dev/null | head -1 | grep -q . && has_docker=true

          {
            echo "has_node=$has_node"
            echo "has_dotnet=$has_dotnet"
            echo "has_python=$has_python"
            echo "has_go=$has_go"
            echo "has_helm=$has_helm"
            echo "has_terraform=$has_terraform"
            echo "has_docker=$has_docker"
          } >> $GITHUB_OUTPUT

          echo "Detected: Node=$has_node .NET=$has_dotnet Python=$has_python Go=$has_go Helm=$has_helm Terraform=$has_terraform Docker=$has_docker"

  node:
    needs: detect
    if: needs.detect.outputs.has_node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present -- --ci --reporter=default

      - name: Build
        run: npm run build --if-present

  dotnet:
    needs: detect
    if: needs.detect.outputs.has_dotnet == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

  python:
    needs: detect
    if: needs.detect.outputs.has_python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then pip install -e ".[dev,test]" 2>/dev/null || pip install -e "." 2>/dev/null || true; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check . || true

      - name: Test
        run: |
          if [ -f pytest.ini ] || [ -f pyproject.toml ]; then
            pip install pytest
            pytest -q || echo "pytest reported failures — see logs"
          fi

  go:
    needs: detect
    if: needs.detect.outputs.has_go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -cover

      - name: Build
        run: go build ./...

  # Helm charts are used on the Azure/hybrid Kubernetes deploy path (ADR-004).
  # This job only fires if Helm charts exist in the repo (has_helm == 'true').
  # AWS ECS Fargate does not use Helm.
  helm:
    needs: detect
    if: needs.detect.outputs.has_helm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Lint charts
        run: |
          find . -type f -name 'Chart.yaml' | while read chart; do
            dir=$(dirname "$chart")
            echo "Linting $dir"
            helm lint "$dir"
          done

      - name: Template sanity
        run: |
          find . -type f -name 'Chart.yaml' | while read chart; do
            dir=$(dirname "$chart")
            echo "Templating $dir"
            helm dependency update "$dir" 2>/dev/null || true
            helm template test "$dir" > /dev/null
          done

  terraform:
    needs: detect
    if: needs.detect.outputs.has_terraform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Format check
        run: terraform fmt -recursive -check

      - name: Validate
        run: |
          find . -type f -name '*.tf' -exec dirname {} \; | sort -u | while read dir; do
            echo "Validating $dir"
            (cd "$dir" && terraform init -backend=false -input=false && terraform validate)
          done

  docker:
    needs: detect
    if: needs.detect.outputs.has_docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Hadolint (Dockerfile linting)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          no-fail: true

      - name: Docker build (sanity)
        run: |
          find . -name 'Dockerfile' -not -path '*/node_modules/*' | while read dockerfile; do
            dir=$(dirname "$dockerfile")
            echo "Building $dockerfile"
            docker build --progress=plain -f "$dockerfile" "$dir" -t local/ci-check:${{ github.sha }} || exit 1
          done

  status:
    name: CI Status
    needs: [detect, node, dotnet, python, go, helm, terraform, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          for job in node dotnet python go helm terraform docker; do
            RESULT="${{ needs[job].result || 'skipped' }}"
            case "$RESULT" in
              success) EMOJI="✅" ;;
              skipped) EMOJI="⏭️" ;;
              failure) EMOJI="❌" ;;
              *) EMOJI="❓" ;;
            esac
            echo "| $job | $EMOJI $RESULT |" >> $GITHUB_STEP_SUMMARY
          done

          # Fail the overall job if any required job failed
          if [ "${{ needs.node.result }}" = "failure" ] || \
             [ "${{ needs.dotnet.result }}" = "failure" ] || \
             [ "${{ needs.python.result }}" = "failure" ] || \
             [ "${{ needs.go.result }}" = "failure" ] || \
             [ "${{ needs.helm.result }}" = "failure" ] || \
             [ "${{ needs.terraform.result }}" = "failure" ] || \
             [ "${{ needs.docker.result }}" = "failure" ]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
