name: AI-DLC - Trigger

on:
  issues:
    types: [opened, reopened, edited, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Existing issue number to process'
        required: true
        type: string

permissions:
  issues: write
  contents: write
  pull-requests: write

concurrency:
  group: aidlc-trigger-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ secrets.PROJECT_MANAGER_PAT }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      stage: ${{ steps.check.outputs.stage }}

    steps:
      - name: Decide whether to run
        id: check
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch — running."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "stage=resume" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BODY=$(gh issue view "$ISSUE_NUMBER" --json body --jq '.body' 2>/dev/null || echo "")
          TITLE=$(gh issue view "$ISSUE_NUMBER" --json title --jq '.title' 2>/dev/null || echo "")
          LABELS=$(gh issue view "$ISSUE_NUMBER" --json labels --jq '.labels[].name' 2>/dev/null || echo "")

          # Trigger 1: issue body starts with "Using AI-DLC," (case-insensitive)
          if echo "$BODY$TITLE" | grep -qiE '(^|\n)\s*using ai-?dlc,'; then
            echo "AI-DLC trigger phrase detected."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "stage=initiate" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Trigger 2: any aidlc:* label
          if echo "$LABELS" | grep -qE '^aidlc:'; then
            STAGE=$(echo "$LABELS" | grep -E '^aidlc:' | head -1 | sed 's/aidlc://')
            echo "AI-DLC label detected: $STAGE"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "No AI-DLC trigger found — skipping."
          echo "should_run=false" >> "$GITHUB_OUTPUT"

  coordinate:
    needs: route
    if: needs.route.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
      GH_TOKEN: ${{ secrets.PROJECT_MANAGER_PAT }}
      GITHUB_TOKEN: ${{ secrets.PROJECT_MANAGER_PAT }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
      STAGE: ${{ needs.route.outputs.stage }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Kiro CLI
        run: |
          curl -fsSL https://cli.kiro.dev/install | bash
          echo "$HOME/.kiro/bin" >> "$GITHUB_PATH"

      - name: Configure git identity
        run: |
          git config user.name "aidlc-lead-engineer[bot]"
          git config user.email "aidlc-lead-engineer[bot]@users.noreply.github.com"

      - name: Run aidlc-lead-engineer
        run: |
          PROMPT="Issue #$ISSUE_NUMBER triggered AI-DLC workflow at stage '$STAGE'. Read the issue, read .kiro/aws-aidlc-rule-details/common/process-overview.md, then follow your stage entry/exit protocol. If stage is 'initiate', derive a slug from the issue title, create aidlc-docs/{slug}/ scaffolding, run workspace detection and extension opt-in questions, and post structured multiple-choice questions as an issue comment. If stage is a known transition (requirements-approved, design-approved, construction-ready, construction-approved), advance to the next stage per the core workflow rules. If stage is 'resume', read aidlc-docs/*/aidlc-state.md for the feature matching this issue and continue where left off. Commit any artefact changes to aidlc-docs/ before ending. Never skip approval gates."

          kiro-cli chat --agent aidlc-lead-engineer --no-interactive \
            --trust-tools=fs_read,fs_write,grep,shell \
            "$PROMPT"

      - name: Commit aidlc-docs changes if any
        run: |
          if [ -n "$(git status --porcelain aidlc-docs 2>/dev/null)" ]; then
            git add aidlc-docs/
            git commit -m "aidlc: coordinator updates for issue #$ISSUE_NUMBER (stage: $STAGE)"
            BRANCH=$(git branch --show-current)
            if [ "$BRANCH" = "main" ]; then
              # On main, push directly (trusted bot)
              git push origin main || echo "Push failed — another run may have pushed first"
            else
              echo "Not on main — changes committed locally but not pushed."
            fi
          else
            echo "No changes to commit."
          fi

      - name: Summary
        if: always()
        run: |
          echo "AI-DLC coordinator run complete for issue #$ISSUE_NUMBER (stage: $STAGE)." >> "$GITHUB_STEP_SUMMARY"
