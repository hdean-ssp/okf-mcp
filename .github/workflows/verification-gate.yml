name: Verification Gate

# Runs the requirements-verifier (traceability gate) on a construction PR. Proves
# every requirement ID maps to a code location and a passing test, emits a coverage
# report as a PR comment, and BLOCKS (fails the check) if any MUST requirement is
# unevidenced or the test suite fails. This is the output-gate fix for silent
# requirement drops.
#
# Triggers:
#   - A pull request to main (opened / synchronised / reopened)
#   - Manual dispatch with a PR number
#
# NOTE: This workflow is intentionally disabled by default. Enable it per repo
# when piloting: gh workflow enable verification-gate.yml
#
# To make it a hard merge gate, add it as a required status check in branch
# protection once you have piloted it.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to verify'
        required: true
        type: string
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: read

concurrency:
  group: verification-gate-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  verify:
    # Skip drafts; they are not ready for the gate
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
      GH_TOKEN: ${{ secrets.PROJECT_MANAGER_PAT }}
      GITHUB_TOKEN: ${{ secrets.PROJECT_MANAGER_PAT }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Kiro CLI
        run: |
          curl -fsSL https://cli.kiro.dev/install | bash
          echo "$HOME/.kiro/bin" >> "$GITHUB_PATH"

      - name: Run requirements-verifier
        run: |
          kiro-cli chat --agent requirements-verifier --no-interactive \
            --trust-tools=fs_read,fs_write,grep,shell \
            "Verify PR #$PR_NUMBER against its structured requirements. Trace every requirement ID to a specific code location and a passing, asserting test. Run the project's test suite and only count a requirement as evidenced if its test passes. Enforce the thresholds in .kiro/steering/definition-of-done.md. Write the coverage report to aidlc-docs/<slug>/construction/verification-report.md, post it (or a tight summary) as a PR comment, and commit the report to the PR branch. After posting, write the single word PASS or BLOCK to the file ./verification-verdict.txt at the repo root so this workflow can set the gate. Do not approve the PR. Do not modify application code or tests."

      - name: Set gate from verdict
        if: always()
        run: |
          if [ -f verification-verdict.txt ]; then
            VERDICT=$(tr -d '[:space:]' < verification-verdict.txt)
            echo "Verification verdict: $VERDICT" >> "$GITHUB_STEP_SUMMARY"
            if [ "$VERDICT" = "BLOCK" ]; then
              echo "::error::Verification gate BLOCKED — one or more requirements are unevidenced or the test suite failed. See the PR comment for the coverage report."
              exit 1
            fi
            echo "Verification gate PASSED — all requirements evidenced. Human reviews judgement items only."
          else
            echo "::warning::No verdict file produced. Treating as inconclusive — review the PR comment manually."
            echo "No verdict file produced; manual review required." >> "$GITHUB_STEP_SUMMARY"
          fi
